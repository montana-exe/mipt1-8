{% extends "base.html" %}
{% block title %}Таблица студентов{% endblock %}
{% block content %}
  <h1>Результаты студентов</h1>
  <table>
    <thead><tr><th>Имя</th><th>Группа</th><th>Оценка</th></tr></thead>
    <tbody>
      {% for student in students %}
        <tr><td>{{ student.name }}</td><td>{{ student.group }}</td><td>{{ student.grade }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
